<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="name">Full Name</label>
        <input id="name" type="text" placeholder="Enter your name" minlength="2" maxlength="20">

        <label for="age">Age</label>
        <input id="age" type="number" placeholder="Enter your age" min="5" max="120">
        
        <label for="birthday">Birthday</label>
        <input id="birthday" type="date" placeholder="Enter your birthday">
         
        <input type="file" accept=".pdf">

        <br/>
        <label>Enter your Adress</label>

        <textarea cols="20" rows="2" placeholder="Enter your address">

        </textarea>
        <br\>
        <input type="submit"/>

    </form>
</body>
</html>
